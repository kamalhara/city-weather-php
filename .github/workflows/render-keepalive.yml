name: Render keep-alive

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          SITE_URL: ${{ vars.RENDER_KEEPALIVE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Set the RENDER_KEEPALIVE_URL repository variable to the Render service URL."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "${SITE_URL%/}/health.php"
